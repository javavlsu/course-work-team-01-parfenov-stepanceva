# Реестр кодов ошибок. Формат: <код>=<сообщение>.
# Коды стабильны и не меняются — фронтенд может маппить их в локализованные строки.

# AU — Auth
AU0001=Authentication cookie is missing
AU0002=Access token expired
AU0003=Refresh token is invalid
AU0004=Refresh token expired, please log in again

# US — User
US0001=User not found by email
US0002=User not found by id
US0003=User with this email already exists
US0004=Invalid password

# BD — Board
BD0001=No access to this board

# CL — Column
CL0001=Column not found

# TS — Task
TS0001=Task not found

# CM — Comment
CM0001=Comment not found
CM0002=No access to this comment

# AT — Attachment
AT0001=Attachment not found

# GR — Group
GR0001=Admin permissions required
GR0002=Not a member of the group
GR0003=User is already a member of the group

# IN — Invitation
IN0001=Invitation not found
IN0002=Invitation expired

# VA — Validation
VA0001=Validation failed
VA0002=Malformed JSON request or invalid data type
VA0003=Invalid enum value

# FL — File
FL0001=File is empty
FL0002=File is too large
FL0003=Invalid file type
FL0004=File storage error
FL0005=Invalid file path

# EN — Entity
EN0001=Entity not found

# SY — System
SY0001=Internal server error
